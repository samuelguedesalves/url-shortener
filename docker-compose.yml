# Milestone 1 stack: Cassandra, Redis, write_api, redirect_api.
# Cassandra runs one node with RF=1 locally; production uses RF=3 (ADR 0003).
# Environment shared by both APIs. write-api adds its own secrets on top (see below); keep them
# out of this map so redirect-api never receives them.
x-service-env: &service_env
  CASSANDRA_NODES: cassandra:9042
  REDIS_URL: redis://redis:6379
  BASE_URL: ${BASE_URL:-http://localhost:4002}

services:
  cassandra:
    image: cassandra:5
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    ports:
      - "127.0.0.1:9042:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: creates the keyspace and tables, then exits.
  migrate:
    build: .
    working_dir: /app/apps/shortener_core
    command: ["mix", "shortener.cassandra.setup"]
    environment:
      CASSANDRA_NODES: cassandra:9042
      CASSANDRA_REPLICATION_FACTOR: "1"
    depends_on:
      cassandra:
        condition: service_healthy
    restart: "no"

  write-api:
    build: .
    working_dir: /app/apps/write_api
    command: ["mix", "run", "--no-halt"]
    environment:
      <<: *service_env
      # Signs session cookies; write_api refuses to boot in prod without 32+ bytes. The default is a
      # dev-only value; override it in .env (see .env.example).
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-change-me-0123456789-abcdefghijklmnopqrstuvwxyz}
      # Signs LiveView and CSRF tokens; write_api refuses to boot in prod without 64+ bytes. The default
      # is a dev-only value; override it in .env.
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-dev-only-secret-key-base-change-me-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJKLMNOPQRSTUVWXYZ}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      # Verifies Google ID tokens. Leave unset and every login fails closed; set it in your shell or .env.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # The image runs MIX_ENV=prod over plain http://localhost, where browsers (Safari) drop Secure cookies.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # The origin this service is served from: the dashboard is a LiveView inside write-api, so
      # CORS and the POST origin check allow this value. Behind the LAN override use http://<LAN_IP>:4001.
      DASHBOARD_ORIGIN: ${DASHBOARD_ORIGIN:-http://localhost:4001}
    ports:
      - "127.0.0.1:4001:4001"
    depends_on: &service_deps
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  redirect-api:
    build: .
    working_dir: /app/apps/redirect_api
    command: ["mix", "run", "--no-halt"]
    environment: *service_env
    ports:
      - "127.0.0.1:4002:4002"
    depends_on: *service_deps
